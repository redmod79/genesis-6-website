      - "Jude 6-7 Angels' Sin": studies/jude-6-7-angels-sin/CONCLUSION.md
      - "Jude 1:7 'In Like Manner'": studies/jude-1-6-7-in-like-manner/CONCLUSION.md
      - "Strange Flesh (Jude 1:7)": studies/strange-flesh-jude-1-7/CONCLUSION.md
      - 1 Peter 3 Spirits in Prison: studies/1-peter-3-spirits-in-prison/CONCLUSION.md
    - Nephilim & Angels:
      - Nephilim Origin: studies/nephilim-origin/CONCLUSION.md
      - Angels Physical Form: studies/angels-physical-form/CONCLUSION.md
    - Flood & Corruption:
